<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background subtle grey gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#bdbfc1"/>
      <stop offset="100%" stop-color="#8f9294"/>
    </radialGradient>

    <!-- Neon red glow filter -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feFlood flood-color="#ff3b3b" result="flood"/>
      <feComposite in="flood" in2="SourceGraphic" operator="in" result="mask"/>
      <feGaussianBlur in="mask" stdDeviation="28" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft dark inner shadow for text -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComposite in="off" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feColorMatrix in="inner" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.04 0 0 0 0 0.12 0 0 0 0.6 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slight blur for blue text halo (subtle) -->
    <filter id="textHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="g1"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Define a rounded 'D' path approximation using a bold font-ish shape via path -->
    <!-- (This is an approximation — adjust as needed in a vector editor for pixel-perfect fidelity) -->
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Big red D with neon glow -->
  <g transform="translate(110,160) scale(1.1)">
    <!-- Glow -->
    <text x="0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="580" font-weight="900" fill="#ff3b3b" opacity="0.95" filter="url(#neon)">D</text>
    <!-- Dark outline to mimic the engraved look -->
    <text x="0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="580" font-weight="900" fill="none" stroke="#1f2b38" stroke-width="6" stroke-linejoin="round">D</text>

    <!-- House icon inside the D -->
    <g transform="translate(140,140) scale(0.42)">
      <!-- roof -->
      <polygon points="140,30 20,140 260,140" fill="#ff6b6b" opacity="0.98" />
      <!-- house body square -->
      <rect x="40" y="140" width="200" height="160" rx="14" ry="14" fill="#ff3b3b" opacity="0.98" />
      <!-- window: 4 squares -->
      <g fill="#ffd9d9" transform="translate(80,180) scale(0.8)">
        <rect x="0" y="0" width="32" height="32" rx="4"/>
        <rect x="44" y="0" width="32" height="32" rx="4"/>
        <rect x="0" y="44" width="32" height="32" rx="4"/>
        <rect x="44" y="44" width="32" height="32" rx="4"/>
      </g>
      <!-- faint inner stroke for house -->
      <rect x="40" y="140" width="200" height="160" rx="14" ry="14" fill="none" stroke="#802525" stroke-opacity="0.12" stroke-width="6"/>
    </g>
  </g>

  <!-- "omygo" text: hollow/dark outlined style with subtle shadow and slight blue hue -->
  <g transform="translate(420,460)">
    <!-- subtle halo behind text -->
    <text x="0" y="120" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="180" font-weight="600" fill="#0b2740" opacity="0.12" filter="url(#textHalo)">omygo</text>

    <!-- main outlined text (transparent fill, dark blue stroke) -->
    <text x="0" y="120" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="180" font-weight="600" fill="none" stroke="#0b2740" stroke-width="8" stroke-linejoin="round" filter="url(#innerShadow)">omygo</text>

    <!-- thin inner line to give the engraved look -->
    <text x="0" y="120" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="180" font-weight="600" fill="none" stroke="#0b384e" stroke-width="2" stroke-linejoin="round" opacity="0.9">omygo</text>
  </g>

  <!-- subtle vignette to emulate the photo lighting -->
  <radialGradient id="vign" cx="70%" cy="40%" r="90%">
    <stop offset="40%" stop-color="rgba(0,0,0,0)" />
    <stop offset="100%" stop-color="rgba(0,0,0,0.22)" />
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#vign)"/>
</svg>
